name: Build Sculpt Wing - Mac M1

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sculpt-wing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verifica interfaccia e protocollo
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Compila e verifica l'interfaccia
        run: |
          npm ci --prefix native --no-audit --no-fund
          npm run build --prefix native
          npm run test:all --prefix native
      - name: Verifica il trasporto desktop
        timeout-minutes: 2
        run: |
          npm ci --prefix desktop --no-audit --no-fund
          npm test --prefix desktop

  build-m1:
    name: Sculpt Wing - Mac M1 (arm64)
    needs: verify
    # Build the ARM64 Electron bundle on the available Intel Mac runner.
    # Target architecture is explicit below and verified with lipo.
    runs-on: macos-15-intel
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verifica il Mac di compilazione
        run: test "$(uname -s)" = Darwin
      - name: Compila l'interfaccia
        run: |
          npm ci --prefix native --no-audit --no-fund
          npm run build --prefix native
      - name: Installa gli strumenti desktop
        run: npm ci --prefix desktop --no-audit --no-fund
      - name: Test TCP e UDP sul Mac di compilazione
        timeout-minutes: 2
        run: npm test --prefix desktop
      - name: Crea l'app ARM64 per Mac M1
        working-directory: desktop
        run: |
          npm run prepare:app
          npx --no-install electron-builder --mac zip --arm64 --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false
      - name: Verifica architettura e firma dell'app
        working-directory: desktop
        run: |
          app="release/mac-arm64/Sculpt Wing.app"
          test "$(lipo -archs "$app/Contents/MacOS/Sculpt Wing")" = arm64
          codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(codesign -dv --verbose=2 "$app" 2>&1)"
          printf '%s\n' "$signature"
          [[ "$signature" == *"Signature=adhoc"* ]]
      - uses: actions/upload-artifact@v6
        with:
          name: Sculpt-Wing-Mac-M1
          path: desktop/release/Sculpt-Wing-*-mac-arm64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
