name: Build Sculpt Wing
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: sculpt-wing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Test e compilazione
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v6
        with: {node-version: '22'}
      - name: Verifica interfaccia, protocollo e desktop
        shell: bash
        env: {ELECTRON_SKIP_BINARY_DOWNLOAD: '1'}
        run: |
          npm ci --prefix native --no-audit --no-fund
          npm run build --prefix native
          npm run test:all --prefix native
          npm ci --prefix desktop --no-audit --no-fund
          npm test --prefix desktop
  build:
    name: ${{ matrix.artifact }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            app_dir: mac-arm64
            artifact: Sculpt-Wing-macOS-arm64
            file: Sculpt-Wing-*-mac-arm64.zip
          - runner: macos-15-intel
            arch: x64
            app_dir: mac
            artifact: Sculpt-Wing-macOS-x64
            file: Sculpt-Wing-*-mac-x64.zip
          - runner: windows-2025
            arch: x64
            app_dir: win-unpacked
            artifact: Sculpt-Wing-Windows-x64
            file: Sculpt-Wing-*-win-x64.exe
    defaults:
      run: {shell: bash}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      SCULPT_ARCH: ${{ matrix.arch }}
      SCULPT_APP_DIR: ${{ matrix.app_dir }}
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v6
        with: {node-version: '22'}
      - name: Compila e prepara il desktop
        run: |
          npm ci --prefix native --no-audit --no-fund
          npm run build --prefix native
          npm ci --prefix desktop --no-audit --no-fund
          npm test --prefix desktop
          npm run prepare:app --prefix desktop
      - name: Crea e verifica l'app Mac
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          npx --no-install electron-builder --mac zip "--$SCULPT_ARCH" --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false
          codesign --verify --deep --strict --verbose=2 "release/$SCULPT_APP_DIR/Sculpt Wing.app"
          SCULPT_SIGNATURE="$(codesign -dv --verbose=2 "release/$SCULPT_APP_DIR/Sculpt Wing.app" 2>&1)"
          printf '%s\n' "$SCULPT_SIGNATURE"
          [[ "$SCULPT_SIGNATURE" == *"Signature=adhoc"* ]]
      - name: Crea l'installer Windows
        if: runner.os == 'Windows'
        working-directory: desktop
        run: npx --no-install electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: desktop/release/${{ matrix.file }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
