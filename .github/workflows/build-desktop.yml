name: Build Sculpt Wing - Mac M1

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sculpt-wing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verifica interfaccia e protocollo
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Compila e verifica l'interfaccia
        run: |
          npm ci --prefix native --no-audit --no-fund
          npm run build --prefix native
          npm run test:all --prefix native
      - name: Verifica il trasporto desktop
        timeout-minutes: 2
        run: |
          npm ci --prefix desktop --no-audit --no-fund
          npm test --prefix desktop

  build-m1:
    name: Sculpt Wing - Mac M1 (arm64)
    needs: verify
    # Native Apple Silicon runner: both the helper and its real VST3 fixture
    # execute on the same architecture as the distributed app.
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # PR builds use the same local ad-hoc identity; no signing secret is used.
      CSC_FOR_PULL_REQUEST: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verifica il Mac di compilazione
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
      - name: Compila l'interfaccia
        run: |
          npm ci --prefix native --no-audit --no-fund
          npm run build --prefix native
      - name: Installa gli strumenti desktop
        run: npm ci --prefix desktop --no-audit --no-fund
      - name: Test TCP e UDP sul Mac di compilazione
        timeout-minutes: 2
        run: npm test --prefix desktop
      - name: Compila il motore VST3 e il plugin di verifica ARM64
        run: npm run build:audio --prefix desktop -- --with-test-plugin
      - name: Verifica il motore nativo senza aprire dispositivi audio
        timeout-minutes: 3
        run: |
          ctest --test-dir audio-host/build --build-config Release --output-on-failure
          host="audio-host/build/SculptWingAudio_artefacts/Release/SculptWingAudio.app/Contents/MacOS/SculptWingAudio"
          fixture="audio-host/build/SculptWingAudioTestGain_artefacts/Release/VST3/SculptWingAudioTestGain.vst3"
          "$host" --test-plugin "$fixture"
          node desktop/scripts/check-audio-host.cjs "$host"
      - name: Firma il motore incluso nell’app
        run: codesign --force --deep --sign - audio-host/build/SculptWingAudio_artefacts/Release/SculptWingAudio.app
      - name: Crea l'app ARM64 per Mac M1
        working-directory: desktop
        run: |
          npm run prepare:app
          npx --no-install electron-builder --mac zip --arm64 --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false
      - name: Verifica architettura e firma dell'app
        working-directory: desktop
        run: |
          app="release/mac-arm64/Sculpt Wing.app"
          test "$(lipo -archs "$app/Contents/MacOS/Sculpt Wing")" = arm64
          host="$app/Contents/Resources/audio-host/SculptWingAudio.app"
          test "$(lipo -archs "$host/Contents/MacOS/SculptWingAudio")" = arm64
          codesign --verify --deep --strict --verbose=2 "$host"
          codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(codesign -dv --verbose=2 "$app" 2>&1)"
          printf '%s\n' "$signature"
          [[ "$signature" == *"Signature=adhoc"* ]]
      - name: Verifica il motore realmente incluso nell'app
        timeout-minutes: 3
        run: |
          host="desktop/release/mac-arm64/Sculpt Wing.app/Contents/Resources/audio-host/SculptWingAudio.app/Contents/MacOS/SculptWingAudio"
          "$host" --self-test
          node desktop/scripts/check-audio-host.cjs "$host"
      - uses: actions/upload-artifact@v6
        with:
          name: Sculpt-Wing-Mac-M1
          path: desktop/release/Sculpt-Wing-*-mac-arm64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
